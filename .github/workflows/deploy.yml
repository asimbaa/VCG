name: Deploy Valourian Capital OS PWA to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Setup Node.js Runtime
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Execute Pre-Build PWA Manifest & Service Worker Cache-Busting
        env:
          BUILD_HASH: ${{ github.sha }}
        run: node scripts/pwa-cache-bust.js

      - name: Build Production Web Application
        env:
          NODE_ENV: production
          VITE_BUILD_SHA: ${{ github.sha }}
        run: npm run build

      - name: Execute Post-Build Distribution & Routing Hardening
        env:
          BUILD_HASH: ${{ github.sha }}
        run: node scripts/pwa-cache-bust.js --post-build

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Artifact to GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Publish to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
