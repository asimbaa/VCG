    <meta property="og:title" content="Valourian Capital Management" />
    <meta property="og:description" content="Tier 1 Global Treasury OS. Encrypted administrative interface securing over $1.02 Trillion AUD in unified global assets, real estate, global transportation networks, and deep tech investments including Uber, Skyscanner, eToro, CommBank, and Coinbase infrastructure." />
    
    <script>
      const __originalError = console.error;
      console.error = function(...args) {
        if (typeof args[0] === 'string' && (
          args[0].includes('[vite]') || 
          args[0].includes('WebSocket') || 
          args[0].includes('ResizeObserver') ||
          args[0].includes('send was called before connect') ||
          args[0].includes('Could not reach Cloud Firestore backend') ||
          args[0].includes('The operation could not be completed')
        )) return;
        if (args[0] && args[0].message && (
          args[0].message.includes('WebSocket') || 
          args[0].message.includes('[vite]') ||
          args[0].message.includes('send was called before connect') ||
          args[0].message.includes('Could not reach Cloud Firestore backend')
        )) return;
        __originalError.apply(console, args);
      };
      
      const __originalWarn = console.warn;
      console.warn = function(...args) {
        if (typeof args[0] === 'string' && (
          args[0].includes('[vite]') || 
          args[0].includes('WebSocket') ||
          args[0].includes('Could not reach Cloud Firestore backend') ||
          args[0].includes('operate in offline mode')
        )) return;
        __originalWarn.apply(console, args);
      };

      const __originalLog = console.log;
      console.log = function(...args) {
        if (typeof args[0] === 'string' && args[0].includes('[vite]')) return;
        __originalLog.apply(console, args);
      };

      window.addEventListener('error', function(e) {
        if (e.message && (
          e.message.includes('WebSocket') || 
          e.message.includes('[vite]') || 
          e.message.includes('ResizeObserver') ||
          e.message.includes('send was called before connect') ||
          e.message.includes('Could not reach Cloud Firestore backend')
        )) {
          e.preventDefault();
          e.stopImmediatePropagation();
        }
      });
      window.addEventListener('unhandledrejection', function(e) {
        if (e.reason && (
          (e.reason.message && (
            e.reason.message.includes('WebSocket') || 
            e.reason.message.includes('[vite]') ||
            e.reason.message.includes('send was called before connect') ||
            e.reason.message.includes('Could not reach Cloud Firestore backend')
          )) ||
          (typeof e.reason === 'string' && (
            e.reason.includes('WebSocket') ||
            e.reason.includes('send was called before connect')
          ))
        )) {
          e.preventDefault();
        }
      });
    </script>
